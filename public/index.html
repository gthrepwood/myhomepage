<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Homepage</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Dark/Light Mode Toggle -->
    <div class="theme-toggle">
        <button class="btn" onclick="toggleTheme()" id="themeBtn" title="Toggle dark/light mode">
            🌙
        </button>
    </div>

    <!-- Hamburger Menu -->
    <div class="hamburger-menu">
        <button class="hamburger-btn" onclick="toggleHamburger()" title="Menu">☰</button>
        <div class="hamburger-dropdown" id="hamburgerDropdown">
            <button class="menu-item" onclick="saveButtons()">💾 Save</button>
            <button class="menu-item" onclick="document.getElementById('restoreFileInput').click()">📂 Restore</button>
            <input type="file" id="restoreFileInput" accept=".json" style="display:none" onchange="restoreButtons(this)">
            <div class="menu-divider"></div>
            <div class="about-section">
                <strong>My Homepage</strong><br>
                Version: <span id="appVersion">-</span><br>
                <a href="https://github.com/gthrepwood/myhomepage" target="_blank">GitHub</a><br>
                <br>
                &copy; 2026 gthrepwood
            </div>
        </div>
    </div>

    <div class="container">
        <header>
            <h1>My Applications</h1>
            <button id="addButton" class="add-btn">+ Add Application</button>
        </header>
        
        <div id="buttonsContainer" class="buttons-container">
            <!-- Buttons will be rendered here -->
            <div class="resize-handle" title="Drag to resize buttons"></div>
        </div>
    </div>

    <!-- Modal for adding/editing button -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="modalTitle">Add Application</h2>
            <form id="buttonForm">
                <div class="form-group">
                    <label for="name">Name (optional - auto-generated from URL)</label>
                    <input type="text" id="name" name="name" placeholder="Leave empty to auto-generate from URL">
                </div>
                <div class="form-group">
                    <label for="url">URL</label>
                    <input type="url" id="url" name="url" required placeholder="https://example.com">
                </div>
                <div class="form-actions">
                    <button type="button" id="deleteBtn" class="delete-btn">Delete</button>
                    <button type="button" id="cancelBtn" class="cancel-btn">Cancel</button>
                    <button type="submit" class="save-btn">Save</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Dark/Light Mode Toggle
        function toggleTheme() {
            const body = document.body;
            const themeBtn = document.getElementById('themeBtn');
            
            body.classList.toggle('dark-mode');
            
            if (body.classList.contains('dark-mode')) {
                themeBtn.textContent = '☀️';
                localStorage.setItem('theme', 'dark');
            } else {
                themeBtn.textContent = '🌙';
                localStorage.setItem('theme', 'light');
            }
        }
        
        // Load saved theme
        function loadTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeBtn').textContent = '☀️';
            }
        }
        
        // Initialize theme on page load
        loadTheme();

        // Hamburger Menu Toggle
        function toggleHamburger() {
            document.getElementById('hamburgerDropdown').classList.toggle('open');
        }

        document.addEventListener('click', (e) => {
            const menu = document.querySelector('.hamburger-menu');
            if (!menu.contains(e.target)) {
                document.getElementById('hamburgerDropdown').classList.remove('open');
            }
        });

        // Fetch and display version
        fetch('/api/version')
            .then(res => res.json())
            .then(data => {
                document.getElementById('appVersion').textContent = data.version;
            })
            .catch(() => {});
    </script>
</body>
</html>
