version: '3.8'

services:
  myhomepage:
    image: docker.io/gthrepwood/myhomepage:latest
    ports:
      - "3006:3006"
    volumes:
      - /mnt/user/appdata/myhomepage/data:/app/data
    restart: unless-stopped
    labels:
      - "net.unraid.docker.managed=composeman"
      - "net.unraid.docker.webui=http://[IP]:[PORT:3006]/"
      - "net.unraid.docker.icon=/home/crown/Downloads/mask-happly-svgrepo-com.svg"
